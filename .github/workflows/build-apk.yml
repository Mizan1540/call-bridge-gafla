name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.2"
          channel: stable
          cache: true

      - name: Create Android project
        run: |
          flutter create --org com.callbridgegafla --project-name call_bridge_domino /tmp/flutter_app
          cp pubspec.yaml /tmp/flutter_app/pubspec.yaml
          rm -rf /tmp/flutter_app/lib
          cp -r lib /tmp/flutter_app/lib
          cd /tmp/flutter_app
          flutter pub get

      - name: Build Debug APK
        working-directory: /tmp/flutter_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: call-bridge-domino-debug-apk
          path: /tmp/flutter_app/build/app/outputs/flutter-apk/app-debug.apk
